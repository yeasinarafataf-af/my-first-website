<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> My first website</title>
    </head>
    <body>
        <form action="https://formspree.io/f/mjgzpvar" method="post" enctype="multipart/form-data">
        <label for="name"> Username:</label>
        <input type="text" id="username" minlength="6" maxlength="15" placeholder="username" required name="username">
         <br>

        <label for="password"> Password:</label>
        <input type="password" id="password" minlength="6" maxlength="15" placeholder="password" required name="password">
        <br>

        <label for="email"> E-mail: </label>
        <input type="email" id="email" placeholder="e-mail" required name="email">
        <br>

        <label for="age"> Age: </label>
        <input type="number" id="age" min="18" max="100" required name="age">
        <br>

        <label for="gender"> Gender: </label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">  Male </label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female"> Female </label>
        <input type="radio" id="other" name="gender" value="other" name required >
        <label for="other"> Other </label><br>

        <label for="country"> Country: </label>
        <select id="country"  required name="country">
            <option value="">Select your country</option>
            <option value="usa">USA</option>
            <option value="canada">Canada</option>
            <option value="uk">UK</option>
            <option value="australia">Australia</option>
            <option value="bangladesh">Bangladesh</option>
            <option value="other">Other</option>
        </select><br>
        
        <label for="title"> Title:</label>
        <input type="radio" id="mr" name="title" value="mr" name="title">
        <label for="Mr."> Mr.</label>
        <input type="radio" id="mrs" name="title" value="mrs" name="title">
        <label for="Mrs."> Mrs.</label>
        <input type="radio" id="ms" name="title" value="ms" name="title">
        <label for="Ms."> Ms.</label>
        <input type="radio" id="phd" name="title" value="phd" name="title">
        <label for="PhD."> PhD.</label><br>
        


        <label for="bday"> Birth Date: </label>
        <input type="date" id="bday" name="bday" required>,<br>

        <label for="comment"> Comment:</label>
        <textarea name="user_comment" id="comment" rows="4" cols="50" placeholder="Enter your comment here..."></textarea>  <br>
        
        <label for="subscribe"> Subscribe to newsletter: </label>
        <input type="checkbox" id="subscribe" name="subscribe" value="yes"><br>

        <label for="color"> Favorite Color: </label>
        <input type="color" id="color" name="color" value="#ff0000"><br>

        <label for="file"> Upload a file: </label>
        <input type="file" id="file" name="file"><br>

        <br>
        <input type="submit">
        <br>
        <input type="reset">
    </body>
</html>
